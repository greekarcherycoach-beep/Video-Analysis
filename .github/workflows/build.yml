name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: archerylab-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Εγκατάσταση πακέτων
        run: npm install

      - name: Δημιουργία Android project
        run: |
          [ -d android ] || npx cap add android

      - name: Εικονίδια εφαρμογής (από assets/)
        run: npx @capacitor/assets generate --android

      - name: Sync web αρχείων
        run: npx cap sync android

      - name: Permissions + έκδοση
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: python3 scripts/patch-android.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcheryLab-debug
          path: archerylab-apk/android/app/build/outputs/apk/debug/app-debug.apk

      # ---------- Release (υπογεγραμμένο) – τρέχει ΜΟΝΟ αν έχεις βάλει τα secrets ----------
      - name: Έλεγχος keystore
        id: ks
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build release APK
        if: steps.ks.outputs.has == 'true'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Υπογραφή release APK
        if: steps.ks.outputs.has == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out ArcheryLab-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify ArcheryLab-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release APK
        if: steps.ks.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ArcheryLab-release
          path: archerylab-apk/ArcheryLab-release.apk

      - name: GitHub Release (όταν υπάρχει tag v*)
        if: steps.ks.outputs.has == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: archerylab-apk/ArcheryLab-release.apk
